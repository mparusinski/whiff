[package]
authors = ["Michal Parusinski <michal@parusinski.me>"]
categories = ["command-line-utilities"]
description = "A touch implementation in rust"
homepage = "https://github.com/mparusinski/whiff"
name = "whiff"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[dependencies]
clap_complete = {version = "4.5.17", optional=true}

[dependencies.clap]
version = "4.5.17"
# TODO: Implement suggestions feature
features = ["derive"]

[features]
completions = ["clap_complete"]
default = ["completions"]
